name: Docker image (GHCR)

# Builds the static export (fetching notes + Git LFS from the pensine repo,
# which the Actions runner supports out of the box) and the RAG chunks, then
# packages them with the Node server into a container pushed to GHCR.
#
# Opt-in for the automatic path: set repo variable ENABLE_DOCKER_BUILD = true.
# It also gates on CI passing first, so a broken build is never imaged.
# workflow_dispatch always runs (manual button), regardless of the variable.
#
# Runtime secrets (ANTHROPIC_API_KEY / LLM_BASE_URL, EMBED_BASE_URL,
# TURNSTILE_SECRET_KEY, COMMENTS_ADMIN_TOKEN, …) are NOT baked in — pass them at
# `docker run` on your server (see .env.example).
#
# NEXT_PUBLIC_TURNSTILE_SITE_KEY is the one exception: it's a public Turnstile
# *site* key (meant to ship in client HTML, unlike the secret key above), and
# Next.js inlines NEXT_PUBLIC_* vars into the static export at build time, so
# it can't be supplied at `docker run` like the others — it must be set here,
# as the repo variable of the same name (Settings → Actions → Variables), not
# a secret. Pairs with the runtime TURNSTILE_SECRET_KEY for comments to
# auto-approve instead of queuing for manual moderation.

#
# The notes live in another repo, so a push to pensine alone used to leave the
# live site on stale notes until the next learn-nebula merge. Two more
# triggers close that gap, both behind the same ENABLE_DOCKER_BUILD opt-in:
#   - repository_dispatch `pensine-updated`, sent by pensine's own
#     rebuild-site.yml on every push to its main (needs a token there);
#   - a nightly schedule, the safety net, which builds only when pensine's
#     main has moved since the last image (see the `pensine` job).

on:
  # `branches` matches the triggering run's branch *name*, so a fork's PR from
  # a branch called `main` would match too; the job's `if` below keeps only
  # CI runs from a push to this repository.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [pensine-updated]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Which pensine commit this run would build, and whether an image already
  # holds it. A successful build saves an empty cache entry keyed on that
  # commit (last step below); the nightly run looks it up and stands down on
  # a hit. Other triggers build regardless.
  pensine:
    name: Pensine revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      built: ${{ steps.marker.outputs.cache-hit }}
    steps:
      - id: rev
        run: echo "sha=$(git ls-remote https://github.com/rwmicro/pensine.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: marker
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pensine-built
          key: pensine-built-${{ steps.rev.outputs.sha }}
          lookup-only: true

  build-and-push:
    needs: pensine
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.ENABLE_DOCKER_BUILD == 'true' && (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        github.event_name == 'repository_dispatch' ||
        (github.event_name == 'schedule' && needs.pensine.outputs.built != 'true')))
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false # the notes (and their LFS assets) come from the pensine repo

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Best-effort: pre-render mermaid diagrams to inline SVG. Self-skips if the
      # browser is missing, so failure here never blocks the build.
      - name: Install Chromium (mermaid pre-render)
        run: pnpm exec playwright install --with-deps chromium || true

      # Persists the pensine clone (scripts/fetch-notes.mjs) across runs. Its
      # ~10k pronunciation audio clips are git-lfs objects — a throwaway clone
      # re-pulls every single one on every run, which is what actually burns a
      # GitHub account's (shared, finite) LFS bandwidth quota. A unique key
      # every run + a prefix restore-key means each run both starts warm AND
      # saves its own state, so git-lfs only ever fetches new/changed clips.
      - name: Cache notes vault clone
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/pensine
          key: pensine-vault-${{ github.run_id }}
          restore-keys: |
            pensine-vault-

      # Derived AVIF/WebP variants, keyed by source content hash
      # (scripts/build-image-variants.mjs). Encoding a few thousand vault
      # images from scratch takes hours; restoring this makes it near-free,
      # and a changed image simply misses its own key.
      - name: Cache derived image variants
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/vault-images
          key: vault-images-${{ github.run_id }}
          restore-keys: |
            vault-images-

      # Brotli-11 variants from scripts/precompress.mjs, keyed by each file's
      # content hash: an unchanged file is copied instead of recompressed,
      # which was most of the ~12 minutes this step spent compressing.
      - name: Cache precompressed variants
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/precompress
          key: precompress-${{ github.run_id }}
          restore-keys: |
            precompress-

      - name: Build static site + RAG chunks
        env:
          NOTES_REPO_TOKEN: ${{ secrets.NOTES_REPO_TOKEN }} # only if the vault is private
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm build:docker

      # The Dockerfile copies these folders as their own layers; COPY fails on a
      # missing source, and a vault with no assets or decks is still a site.
      - name: Ensure the layered folders exist
        run: mkdir -p out/engine out/ort out/katex out/anki out/vault

      # The multi-arch buildx (two image filesystems) + gha cache export needs
      # more scratch than the runner has free once the ~20 GB of preinstalled
      # toolchains are counted — the first run died with "No space left on
      # device". Reclaim it here: after the Node build (which still needs Node in
      # the hosted tool cache) and before buildx. Node is left untouched.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      # Emulation so the amd64 runner can also build the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Key-based cosign signature of what was just pushed, verified by the
      # server's podman policy.json before it pulls an update (soc-infrastructure:
      # podman_image_signature_policy_enabled). Skipped until the
      # COSIGN_PRIVATE_KEY secret exists. The key only reaches the signing
      # step, never the build's scripts. --recursive signs the index and each
      # platform manifest. cosign 2.x on purpose: it stores signatures as the
      # `sha256-<digest>.sig` tag podman reads (3.x defaults to the new bundle
      # format, published as an OCI referrer podman doesn't look at).
      - name: Check for a signing key
        id: cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: echo "enabled=$([ -n "$COSIGN_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.cosign.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Sign the pushed image
        if: steps.cosign.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE"

      - name: Record the pensine revision this image holds
        run: mkdir -p .pensine-built && echo "${{ needs.pensine.outputs.sha }}" > .pensine-built/sha

      - name: Save revision marker
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pensine-built
          key: pensine-built-${{ needs.pensine.outputs.sha }}
