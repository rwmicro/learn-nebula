name: CI

# Runs on every push to main and every pull request. Gates merges on the same
# checks you run locally: TypeScript (app + server), oxlint + ESLint, the vitest
# unit suite, and a full static-export build (fetches notes from the public
# pensine repo; the Cloudflare index + mermaid pre-render self-skip, so no
# secrets are required).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5 — version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check (app)
        run: pnpm exec tsc --noEmit

      # server/ (self-hosted Node backend) is excluded from the root tsconfig and
      # typechecked on its own. (The legacy Cloudflare functions/ are no longer
      # typechecked here — they depend on @cloudflare/workers-types, removed when
      # the project moved to Docker; they live on the cloudflare-deploy branch.)
      - name: Type-check (Node server)
        run: pnpm exec tsc -p server/tsconfig.json

      # Fast Rust-based pre-check (milliseconds): catches common mistakes before
      # the slower type-aware ESLint pass. Warnings don't fail; real errors do.
      - name: Lint (oxlint, fast pre-check)
        run: pnpm exec oxlint

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  build:
    name: Build (static export)
    runs-on: ubuntu-latest
    # The full build alone now takes 15-19 minutes on a hosted runner, so 20
    # cut the browser tests off twice; 30 leaves room for them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # scripts/render-mermaid.mjs needs a real DOM to turn ```mermaid blocks
      # into SVG, and now fails the build rather than skipping — a block left
      # unrendered makes every reader of that page fetch mermaid.min.js (3.4 MB)
      # in the browser. Without this step CI never exercised that path at all,
      # so a pre-render regression could only ever surface in docker.yml.
      # No `|| true` here on purpose: if the browser can't be installed, the
      # build this job is meant to validate isn't the build that ships.
      - name: Install Chromium (mermaid pre-render, Playwright specs)
        run: pnpm exec playwright install --with-deps chromium

      # Persists the pensine clone (scripts/fetch-notes.mjs) across runs. Its
      # ~10k pronunciation audio clips are git-lfs objects — a throwaway clone
      # re-pulls every single one on every run, which is what actually burns a
      # GitHub account's (shared, finite) LFS bandwidth quota. A unique key
      # every run + a prefix restore-key means each run both starts warm AND
      # saves its own state, so git-lfs only ever fetches new/changed clips.
      - name: Cache notes vault clone
        uses: actions/cache@v4
        with:
          path: .cache/pensine
          key: pensine-vault-${{ github.run_id }}
          restore-keys: |
            pensine-vault-

      # Derived AVIF/WebP variants, keyed by source content hash
      # (scripts/build-image-variants.mjs). Encoding a few thousand vault
      # images from scratch takes hours; restoring this makes it near-free,
      # and a changed image simply misses its own key.
      - name: Cache derived image variants
        uses: actions/cache@v4
        with:
          path: .cache/vault-images
          key: vault-images-${{ github.run_id }}
          restore-keys: |
            vault-images-

      # Full production build → catches export-time breakage the typecheck can't
      # (bad page imports, invalid generateStaticParams, broken static export).
      # Fetches notes from the public pensine repo and pre-renders every mermaid
      # diagram with the Chromium installed above.
      - name: Build
        env:
          NOTES_REPO_TOKEN: ${{ secrets.NOTES_REPO_TOKEN }}
        run: pnpm build

      # Browser checks against the export this job just produced. Only the specs
      # that assert behaviour: tests/style.spec.js compares screenshots, and its
      # baselines aren't tracked, so in CI it would either write them fresh and
      # compare a run to itself or fail on a Chromium revision bump. It stays a
      # local tool until those baselines are pinned to a container image.
      #
      # This is where the WCAG contrast failure in .callout-warning would have
      # been caught — axe covers the whole page, not just what changed.
      - name: Browser tests (functional + accessibility)
        run: pnpm exec playwright test tests/functional.spec.js tests/a11y.spec.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
