name: CI

# Runs on every push to main and every pull request. Gates merges on the same
# checks you run locally: TypeScript (app + server), oxlint + ESLint, the vitest
# unit suite, and a full static-export build (fetches notes from the public
# pensine repo; the Cloudflare index + mermaid pre-render self-skip, so no
# secrets are required).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5 — version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check (app)
        run: pnpm exec tsc --noEmit

      # server/ (self-hosted Node backend) is excluded from the root tsconfig and
      # typechecked on its own. (The legacy Cloudflare functions/ are no longer
      # typechecked here — they depend on @cloudflare/workers-types, removed when
      # the project moved to Docker; they live on the cloudflare-deploy branch.)
      - name: Type-check (Node server)
        run: pnpm exec tsc -p server/tsconfig.json

      # The image runs the server compiled (Dockerfile `server` stage): make
      # sure it bundles and boots, so a bundling regression fails here, not
      # after a pushed image's healthcheck.
      - name: Compile + boot the Node server
        run: |
          pnpm build:server
          mkdir -p /tmp/srv
          # /healthz is 503 until the static export is readable.
          echo '<!doctype html>' > /tmp/srv/index.html
          PORT=8931 DB_PATH=/tmp/srv/c.db STATIC_DIR=/tmp/srv node build/server/index.mjs &
          for i in $(seq 1 20); do curl -fsS localhost:8931/healthz && exit 0; sleep 1; done
          exit 1

      # Fast Rust-based pre-check (milliseconds): catches common mistakes before
      # the slower type-aware ESLint pass. Warnings don't fail; real errors do.
      - name: Lint (oxlint, fast pre-check)
        run: pnpm exec oxlint

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  build:
    name: Build (static export)
    runs-on: ubuntu-latest
    # The full build alone now takes 15-19 minutes on a hosted runner, so 20
    # cut the browser tests off twice; 30 leaves room for them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # scripts/render-mermaid.mjs needs a real DOM to turn ```mermaid blocks
      # into SVG, and now fails the build rather than skipping — a block left
      # unrendered makes every reader of that page fetch mermaid.min.js (3.4 MB)
      # in the browser. Without this step CI never exercised that path at all,
      # so a pre-render regression could only ever surface in docker.yml.
      # No `|| true` here on purpose: if the browser can't be installed, the
      # build this job is meant to validate isn't the build that ships.
      - name: Install Chromium (mermaid pre-render, Playwright specs)
        run: pnpm exec playwright install --with-deps chromium

      # Persists the pensine clone (scripts/fetch-notes.mjs) across runs. Its
      # ~10k pronunciation audio clips are git-lfs objects — a throwaway clone
      # re-pulls every single one on every run, which is what actually burns a
      # GitHub account's (shared, finite) LFS bandwidth quota. A unique key
      # every run + a prefix restore-key means each run both starts warm AND
      # saves its own state, so git-lfs only ever fetches new/changed clips.
      - name: Cache notes vault clone
        uses: actions/cache@v5
        with:
          path: .cache/pensine
          key: pensine-vault-${{ github.run_id }}
          restore-keys: |
            pensine-vault-

      # Derived AVIF/WebP variants, keyed by source content hash
      # (scripts/build-image-variants.mjs). Encoding a few thousand vault
      # images from scratch takes hours; restoring this makes it near-free,
      # and a changed image simply misses its own key.
      - name: Cache derived image variants
        uses: actions/cache@v5
        with:
          path: .cache/vault-images
          key: vault-images-${{ github.run_id }}
          restore-keys: |
            vault-images-

      # Next's own build cache ("No build cache found" otherwise). Same
      # unique-key + prefix-restore pattern as the caches above.
      - name: Cache Next build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            next-${{ hashFiles('pnpm-lock.yaml') }}-

      # Full production build → catches export-time breakage the typecheck can't
      # (bad page imports, invalid generateStaticParams, broken static export).
      # Fetches notes from the public pensine repo and pre-renders every mermaid
      # diagram with the Chromium installed above.
      - name: Build
        #
        # Brotli 11 over the export (scripts/precompress.mjs) was ~12 of this
        # step's ~17 minutes. Nothing in this job serves the .br files (the
        # browser tests use `npx serve`), so a fast quality still runs the
        # script without the cost; the shipped image keeps 11 (docker.yml).
        env:
          NOTES_REPO_TOKEN: ${{ secrets.NOTES_REPO_TOKEN }}
          PRECOMPRESS_BROTLI_QUALITY: "4"
        run: pnpm build

      # The unit job has no vault, so it checks path names on the fixture one
      # only. Here the real one is fetched: every reading path must have its
      # name translated in messages/*.json (pathName.<slug>), or its title
      # stays French in every language.
      - name: Reading path names translated (fetched vault)
        env:
          REQUIRE_VAULT: "1"
        run: pnpm exec vitest run lib/path-names.test.ts

      # Browser checks against the export this job just produced. Only the specs
      # that assert behaviour: the screenshots (tests/style.spec.js) need the
      # fixed vault and the pinned image, so they have their own job, "visual".
      #
      # This is where the WCAG contrast failure in .callout-warning would have
      # been caught — axe covers the whole page, not just what changed.
      - name: Browser tests (functional + accessibility)
        run: pnpm exec playwright test tests/functional.spec.js tests/a11y.spec.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression (screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same image scripts/visual.sh runs locally: same Chromium, same fonts,
    # so the tracked baselines in tests/style.spec.js-snapshots/ compare pixel
    # for pixel. Its tag must follow @playwright/test in pnpm-lock.yaml (a
    # mismatch fails at launch: "Executable doesn't exist").
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Builds from tests/fixtures/vault (not pensine, which changes daily),
      # then compares. To accept a change: scripts/visual.sh --update-snapshots,
      # look at the PNGs, commit them.
      - name: Build the fixture site and compare screenshots
        env:
          VISUAL_IN_CONTAINER: "1"
          CI: "1"
        run: scripts/visual.sh

      - name: Upload the diffs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
