name: CI

# Runs on every push to main and every pull request. Gates merges on the same
# checks you run locally: TypeScript (app + Pages Functions), ESLint, the vitest
# unit suite, and a full static-export build (fetches notes from the public
# pensine repo; the Cloudflare index + mermaid pre-render self-skip, so no
# secrets are required).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5 — version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check (app)
        run: pnpm exec tsc --noEmit

      # functions/ is excluded from the root tsconfig, so the RAG backend
      # (ask.ts, comments.ts, translate.ts) needs its own typecheck pass.
      - name: Type-check (Pages Functions)
        run: pnpm exec tsc -p functions/tsconfig.json

      # server/ (self-hosted Node backend) is likewise excluded from the root
      # tsconfig and typechecked on its own.
      - name: Type-check (Node server)
        run: pnpm exec tsc -p server/tsconfig.json

      # Fast Rust-based pre-check (milliseconds): catches common mistakes before
      # the slower type-aware ESLint pass. Warnings don't fail; real errors do.
      - name: Lint (oxlint, fast pre-check)
        run: pnpm exec oxlint

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  build:
    name: Build (static export)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Full production build → catches export-time breakage the typecheck can't
      # (bad page imports, invalid generateStaticParams, broken static export).
      # Fetches notes from the public pensine repo; index-notes (Cloudflare) and
      # render-mermaid (Chromium) self-skip when their creds/browser are absent.
      - name: Build
        env:
          NOTES_REPO_TOKEN: ${{ secrets.NOTES_REPO_TOKEN }}
        run: pnpm build
