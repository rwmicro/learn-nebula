name: Deploy (Cloudflare Pages)

# Optional GitHub Actions deploy path for the static export + Pages Functions.
# It is INERT until you opt in, so it won't clash with Cloudflare Pages' built-in
# Git integration. To enable:
#   1. Repo → Settings → Variables → Actions: set  ENABLE_CF_DEPLOY = true
#   2. Repo → Settings → Secrets → Actions, add:
#        CLOUDFLARE_API_TOKEN   (scopes: Pages:Edit, Workers AI:Run, Vectorize:Edit)
#        CLOUDFLARE_ACCOUNT_ID
#        NOTES_REPO_TOKEN       (only if the notes repo is private)
#   Note: the /api/* Functions read their own secrets (ANTHROPIC_API_KEY,
#   TURNSTILE_SECRET_KEY, COMMENTS_ADMIN_TOKEN) from the Pages project at runtime
#   — set those with `wrangler pages secret put …`, not here.
#
# If you keep using Cloudflare's native Git build, just leave ENABLE_CF_DEPLOY
# unset and this workflow never runs.
#
# Gating: this runs only AFTER the CI workflow succeeds on main, so a build with
# broken types/lint/tests is never deployed. (workflow_run only fires once this
# file is on the default branch.)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.ENABLE_CF_DEPLOY == 'true' }}
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Persists the RAG index manifest between deploys so scripts/index-notes.mjs
      # only re-embeds notes whose content changed (see FORCE_REINDEX to override).
      - name: Restore RAG index manifest
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: rag-index-${{ github.run_id }}
          restore-keys: |
            rag-index-

      # Lets scripts/render-mermaid.mjs pre-render diagrams; it self-skips if the
      # browser is missing, so this is best-effort.
      - name: Install Chromium (for mermaid pre-render)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build static export
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTES_REPO_TOKEN: ${{ secrets.NOTES_REPO_TOKEN }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=the-gardener --branch=main
