# Self-hosted stack: the static site + Node backend, with
#   • embeddings  → LM Studio running ON THE HOST (LM Studio is a desktop app —
#                   there is no LM Studio Docker image; the container reaches it
#                   over host.docker.internal, see extra_hosts below)
#   • generation  → Anthropic (Claude)
#
# Setup:
#   1. In LM Studio: download & load "text-embedding-bge-m3@Q8_0", then start the
#      local server (Developer tab → Start Server) on port 1234.
#   2. Put your key in .env:   ANTHROPIC_API_KEY=sk-ant-...
#   3. docker compose up -d
#
# First boot embeds every note chunk once (a few minutes for ~5k chunks) via LM
# Studio; the vectors are cached on the gk-data volume, so restarts are instant.

services:
  web:
    # Pull the CI-built image (multi-arch: amd64 + arm64). The GHCR package is
    # private by default — authenticate once on the host:
    #   echo $GHCR_PAT | docker login ghcr.io -u <github-user> --password-stdin
    # (PAT with read:packages), or make the package public in its GitHub settings.
    image: ghcr.io/rwmicro/learn-nebula:latest
    # …or build locally instead (requires `pnpm build:docker` first, so out/ and
    # data/rag-chunks.json exist):
    # build: .
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      PORT: "8085"
      # --- Embeddings: LM Studio on the host (bge-m3, Q8_0 quant) ---
      EMBED_BASE_URL: "http://host.docker.internal:1234/v1"
      EMBED_MODEL: "text-embedding-bge-m3@Q8_0"
      # --- Generation + translation: Anthropic (best fit for grounded RAG Q&A;
      #     swap to claude-opus-5 for max quality or claude-haiku-4-5 to save) ---
      GEN_MODEL: "claude-sonnet-5"
      TRANSLATE_MODEL: "claude-sonnet-5"
      # ANTHROPIC_API_KEY is read from .env (env_file above). Leave LLM_BASE_URL
      # unset so generation goes to Anthropic, not a local chat model.
    # Let the container reach LM Studio running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gk-data:/data

volumes:
  gk-data:
