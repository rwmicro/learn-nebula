# Self-hosted stack, sized for many concurrent requests:
#   • embeddings  → TEI (HuggingFace Text Embeddings Inference), a dedicated
#                   high-throughput embeddings server (continuous batching) that
#                   runs bge-m3 in-container on CPU or GPU. Chosen over LM Studio
#                   (a single-user desktop app, not built for load) and over vLLM
#                   (GPU-oriented and overkill for an embeddings-only service).
#   • generation  → Anthropic (Claude).
#
# Setup:
#   1. Put your key in .env:   ANTHROPIC_API_KEY=sk-ant-...
#   2. docker compose up -d     (TEI downloads bge-m3 once, cached on tei-data)
#
# First boot embeds every note chunk once; vectors are cached on gk-data so
# restarts are instant.

services:
  web:
    # Pull the CI-built image (multi-arch: amd64 + arm64). The GHCR package is
    # private by default, and an anonymous pull then fails with a misleading
    # "unauthorized" (GHCR never says "not found") — authenticate once per host:
    #   gh auth refresh -h github.com -s read:packages
    #   gh auth token | docker login ghcr.io -u <github-user> --password-stdin
    # (or a PAT with read:packages instead of the gh token), or make the package
    # public in its GitHub settings — the image bakes in no secrets, only out/,
    # server/ and the chunks of the already-public vault.
    image: ghcr.io/rwmicro/learn-nebula:latest
    # …or build locally instead (requires `pnpm build:docker` first):
    # build: .
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      PORT: "8085"
      # --- Embeddings: the TEI service below (in-cluster, high throughput) ---
      EMBED_BASE_URL: "http://tei:80/v1"
      EMBED_MODEL: "BAAI/bge-m3"
      # --- Generation + translation: Anthropic (best fit for grounded RAG Q&A;
      #     swap to claude-opus-5 for max quality or claude-haiku-4-5 to save) ---
      GEN_MODEL: "claude-sonnet-5"
      TRANSLATE_MODEL: "claude-sonnet-5"
      # ANTHROPIC_API_KEY comes from .env. Leave LLM_BASE_URL unset so generation
      # goes to Anthropic, not a local chat model.
    depends_on:
      - tei # ordering only; the RAG build retries until TEI is ready
    volumes:
      - gk-data:/data

  tei:
    # Dedicated embeddings server. CPU image (tag format is cpu-<version>); for a
    # GPU host use the CUDA image (e.g. text-embeddings-inference:1.6) plus a
    # `deploy.resources.reservations.devices` GPU reservation.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: ["--model-id", "BAAI/bge-m3", "--auto-truncate"]
    restart: unless-stopped
    volumes:
      - tei-data:/data # HuggingFace model cache
    # No container healthcheck: the TEI image ships no shell/curl to run one, so
    # web doesn't gate on it — it starts alongside TEI and the RAG index build
    # retries on its own until TEI has finished downloading bge-m3 (~2 GB).
    #
    # TEI defaults its tokenization workers to nproc and has no built-in memory
    # cap, so on a host that's also your interactive desktop (not a dedicated
    # server) the one-time index build pegs every core and can swap the machine
    # into unresponsiveness. Cap it (adjust to your host — leave a few cores and
    # a few GB free for everything else); the RAG index build just takes longer
    # via web's own retry/backoff, it doesn't fail.
    deploy:
      resources:
        limits:
          cpus: "16"
          memory: 16g

volumes:
  gk-data:
  tei-data: