<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcfcfc" />
    <title>Hors ligne · The Gardener</title>
    <!-- Deliberately self-contained: no external CSS, font or script. This page
         is served by the service worker precisely when the network is gone, so
         anything it had to fetch would fail with it. -->
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: #fcfcfc;
        color: #1a1a1a;
        font-family: "Newsreader", Georgia, "Times New Roman", serif;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      .mark {
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8a857b;
        margin: 0 0 1.5rem;
      }
      h1 {
        margin: 0 0 0.9rem;
        font-size: clamp(1.6rem, 1.2rem + 2vw, 2.4rem);
        font-weight: 500;
        line-height: 1.2;
      }
      p {
        margin: 0 0 1.6rem;
        color: #55514a;
        text-wrap: pretty;
      }
      a {
        display: inline-block;
        padding: 0.55rem 1.4rem;
        border: 1px solid #1a1a1a;
        border-radius: 2px;
        color: #1a1a1a;
        text-decoration: none;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
      }
      a:hover,
      a:focus-visible {
        background: #1a1a1a;
        color: #fcfcfc;
      }
      hr {
        width: 3rem;
        margin: 2.2rem auto 0;
        border: 0;
        border-top: 1px solid #e4e2dd;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">The Gardener</p>
      <h1 data-t="title">Le jardin est hors de portée</h1>
      <p data-t="body">
        Pas de connexion pour l'instant. Les notes déjà consultées restent
        lisibles — reviens en arrière, ou réessaie une fois le réseau revenu.
      </p>
      <a href="/" data-t="retry">Réessayer</a>
      <hr />
    </main>
    <script>
      // Mirror the site's runtime i18n: the chosen locale lives in localStorage.
      (function () {
        var S = {
          fr: {
            title: "Le jardin est hors de portée",
            body: "Pas de connexion pour l'instant. Les notes déjà consultées restent lisibles — reviens en arrière, ou réessaie une fois le réseau revenu.",
            retry: "Réessayer",
            doc: "Hors ligne · The Gardener",
          },
          en: {
            title: "The garden is out of reach",
            body: "No connection right now. Notes you have already opened stay readable — go back, or try again once you are online.",
            retry: "Try again",
            doc: "Offline · The Gardener",
          },
          es: {
            title: "El jardín está fuera de alcance",
            body: "Sin conexión por ahora. Las notas que ya has abierto siguen disponibles — vuelve atrás o inténtalo de nuevo cuando haya red.",
            retry: "Reintentar",
            doc: "Sin conexión · The Gardener",
          },
          zh: {
            title: "花园暂时无法访问",
            body: "当前没有网络连接。已经打开过的笔记仍可阅读——可以返回上一页，或在恢复联网后重试。",
            retry: "重试",
            doc: "离线 · The Gardener",
          },
        };
        var loc = "fr";
        try {
          var saved = localStorage.getItem("locale");
          if (saved && S[saved]) loc = saved;
        } catch (e) {
          /* localStorage unavailable */
        }
        if (loc === "fr") return;
        var s = S[loc];
        document.documentElement.lang = loc;
        document.title = s.doc;
        document.querySelectorAll("[data-t]").forEach(function (el) {
          var k = el.getAttribute("data-t");
          if (s[k]) el.textContent = s[k];
        });
      })();
    </script>
  </body>
</html>
