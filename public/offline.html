<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcfcfc" />
    <title>Hors ligne · The Gardener</title>
    <!-- Deliberately self-contained: no external CSS, font or script. This page
         is served by the service worker precisely when the network is gone, so
         anything it had to fetch would fail with it. -->
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: #fcfcfc;
        color: #1a1a1a;
        font-family: "Newsreader", Georgia, "Times New Roman", serif;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      /* Rain over the garden: lib/deco-art.ts's "rain", its tones written in. */
      .scene {
        width: min(20rem, 100%);
        margin: 0 auto 1.25rem;
      }
      .scene svg {
        display: block;
        width: 100%;
        height: auto;
      }
      h1 {
        margin: 0 0 0.9rem;
        font-size: clamp(1.6rem, 1.2rem + 2vw, 2.4rem);
        font-weight: 500;
        line-height: 1.2;
      }
      p {
        margin: 0 0 1.6rem;
        color: #55514a;
        text-wrap: pretty;
      }
      .acts {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        max-width: 22rem;
        margin: 0 auto;
      }
      .acts a {
        display: block;
        padding: 0.75rem 1rem;
        border: 1px solid #cfcbc1;
        border-radius: 999px;
        color: #1a1a1a;
        text-decoration: none;
        font: 600 1rem system-ui, sans-serif;
      }
      .acts a.go {
        border-color: #3f6b4a;
        background: #3f6b4a;
        color: #fcfcfc;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="scene"><svg viewBox="0 0 320 160" aria-hidden="true" focusable="false"><g fill="hsl(135 32% 82%)"><circle cx="120" cy="44" r="22"/><circle cx="150" cy="34" r="28"/><circle cx="186" cy="46" r="20"/><rect x="100" y="44" width="106" height="22" rx="11"/></g><g stroke="hsl(135 32% 64%)" stroke-width="3" stroke-linecap="round"><path d="M116 78l-4 10M140 82l-4 10M164 78l-4 10M188 82l-4 10M128 100l-4 10M176 100l-4 10"/></g><path d="M20 146c40-16 240-16 280 0z" fill="hsl(135 18% 88%)"/><path d="M120 138V120" stroke="hsl(135 32% 30%)" stroke-width="2.4000000000000004" stroke-linecap="round"/><path d="M120 120c-11.200000000000001 -1.6 -16 -8 -16 -14.4c8 0 14.4 4.800000000000001 16 14.4z" fill="hsl(135 32% 64%)"/><path d="M120 120c11.200000000000001 -1.6 16 -8 16 -14.4c-8 0 -14.4 4.800000000000001 -16 14.4z" fill="hsl(135 32% 42%)"/><path d="M160 136V110" stroke="hsl(135 32% 30%)" stroke-width="2.8499999999999996" stroke-linecap="round"/><path d="M160 110c-13.299999999999999 -1.9 -19 -9.5 -19 -17.099999999999998c9.5 0 17.099999999999998 5.699999999999999 19 17.099999999999998z" fill="hsl(135 32% 64%)"/><path d="M160 110c13.299999999999999 -1.9 19 -9.5 19 -17.099999999999998c-9.5 0 -17.099999999999998 5.699999999999999 -19 17.099999999999998z" fill="hsl(135 32% 42%)"/><path d="M200 138V122" stroke="hsl(135 32% 30%)" stroke-width="2.25" stroke-linecap="round"/><path d="M200 122c-10.5 -1.5 -15 -7.5 -15 -13.5c7.5 0 13.5 4.5 15 13.5z" fill="hsl(135 32% 64%)"/><path d="M200 122c10.5 -1.5 15 -7.5 15 -13.5c-7.5 0 -13.5 4.5 -15 13.5z" fill="hsl(135 32% 42%)"/><g transform="translate(236 100)"><path d="M0 22c0-14 10-22 22-22s22 8 22 22z" fill="hsl(135 32% 42%)"/><path d="M22 22v18c0 4-6 4-6 0" fill="none" stroke="hsl(135 32% 30%)" stroke-width="3" stroke-linecap="round"/></g></svg></div>
      <h1 data-t="title">Il pleut sur la ligne</h1>
      <p data-t="body">
        Pas de réseau pour l'instant. Les notes déjà lues restent lisibles :
        reviens en arrière, ou réessaie une fois le réseau revenu.
      </p>
      <div class="acts">
        <a class="go" href="" data-t="retry">Réessayer</a>
        <a href="/" id="back" data-t="back">Revenir en arrière</a>
      </div>
    </main>
    <script>
      // "Revenir en arrière": the page before, when there is one.
      document.getElementById("back").addEventListener("click", function (e) {
        if (history.length > 1) {
          e.preventDefault();
          history.back();
        }
      });
      // Mirror the site's runtime i18n: the chosen locale lives in localStorage.
      (function () {
        var S = {
          fr: {
            title: "Il pleut sur la ligne",
            body: "Pas de réseau pour l'instant. Les notes déjà lues restent lisibles : reviens en arrière, ou réessaie une fois le réseau revenu.",
            retry: "Réessayer",
            back: "Revenir en arrière",
            doc: "Hors ligne · The Gardener",
          },
          en: {
            title: "It is raining on the line",
            body: "No connection right now. Notes you have already opened stay readable — go back, or try again once you are online.",
            retry: "Try again",
            back: "Go back",
            doc: "Offline · The Gardener",
          },
          es: {
            title: "Llueve sobre la línea",
            body: "Sin conexión por ahora. Las notas que ya has abierto siguen disponibles — vuelve atrás o inténtalo de nuevo cuando haya red.",
            retry: "Reintentar",
            back: "Volver atrás",
            doc: "Sin conexión · The Gardener",
          },
          zh: {
            title: "线路上下雨了",
            body: "当前没有网络连接。已经打开过的笔记仍可阅读——可以返回上一页，或在恢复联网后重试。",
            retry: "重试",
            back: "返回",
            doc: "离线 · The Gardener",
          },
        };
        var loc = "fr";
        try {
          var saved = localStorage.getItem("locale");
          if (saved && S[saved]) loc = saved;
        } catch (e) {
          /* localStorage unavailable */
        }
        if (loc === "fr") return;
        var s = S[loc];
        document.documentElement.lang = loc;
        document.title = s.doc;
        document.querySelectorAll("[data-t]").forEach(function (el) {
          var k = el.getAttribute("data-t");
          if (s[k]) el.textContent = s[k];
        });
      })();
    </script>
  </body>
</html>
